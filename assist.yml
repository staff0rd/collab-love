run:
  - name: run-ios
    command: npm
    args:
      - run
      - ios:run
  - name: supabase:deploy
    command: supabase
    args:
      - db
      - push
  - name: supabase:config
    command: scripts/push-supabase-config.sh
  - name: supabase:functions
    command: supabase
    args:
      - functions
      - deploy
      - notify-devices
  - name: match:sync
    command: bash
    args:
      - scripts/match-sync.sh
    cwd: .
commit:
  push: true
  pull: true
